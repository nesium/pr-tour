[package]
name = "pr-tour"
version = "0.1.0"
edition = "2021"
default-run = "pr-tour"

[lib]
name = "pr_tour_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
notify = "8.2.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
tokio = { version = "1.54.1", features = ["process", "macros", "rt-multi-thread", "sync"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3.27.0"
